name: Django CI/CD

on:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test, and Build Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shivshakti_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shivshakti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: Project_shivshakti.settings
      DJANGO_SECRET_KEY: ci-secret-key-for-tests-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_ALLOWED_ADMIN_IPS: 127.0.0.1
      DJANGO_ADMIN_URL: secure-control-panel/
      DJANGO_ADMIN_LOGIN_URL: admin-login/
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shivshakti_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SERVE_MEDIA: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=.venv,venv,migrations,staticfiles

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test

      - name: Collect static files (build check)
        run: python manage.py collectstatic --noinput

  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL != ''

    steps:
      - name: Trigger deploy on Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
